// browser's own. GUARD: Chromium decides the restore when the reload commits (before this runs) and restores again
// as late layout lands, so the page also undoes any scroll in its first 3 s that the person didn't make; the app
// skips that (its router resets the scroll itself and the tour scrolls on its own). scripts/r8scroll-cdp.mjs measures it.
(function () {
  var GUARD = false;
  var nav = performance.getEntriesByType ? performance.getEntriesByType("navigation")[0] : null;
  var reload = nav ? nav.type === "reload" : !!(performance.navigation && performance.navigation.type === 1);
  if (!reload) return;
  if ("scrollRestoration" in history) {
    history.scrollRestoration = "manual";
    addEventListener("pagehide", function () { history.scrollRestoration = "auto"; });
  }
  var touched = false;
  var stop = function () { touched = true; };
  ["pointerdown", "touchstart", "wheel", "keydown"].forEach(function (t) { addEventListener(t, stop, { passive: true, capture: true }); });
  var top = function () {
    if (touched) return;
    var h = null;
    try { h = location.hash.length > 1 && document.getElementById(decodeURIComponent(location.hash.slice(1))); } catch (e) {}
    if (h) h.scrollIntoView(); else if (!location.hash) scrollTo(0, 0);
  };
  addEventListener("load", function () {
    top();
    if (!GUARD) return;
    addEventListener("scroll", top);
    setTimeout(function () { removeEventListener("scroll", top); }, 3000);
  });
})();
